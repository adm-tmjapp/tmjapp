name: Firebase App Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  API_BASE_URL: https://tmjapp-api-53m7i55c3q-rj.a.run.app/api/
  RELEASE_NOTES: "Build automatico da main: ${{ github.sha }}"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      - name: Distribute APK
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          TESTERS: ${{ vars.FIREBASE_APP_DISTRIBUTION_TESTERS }}
        run: ./scripts/distribute_android.sh

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g firebase-tools

      - name: Install Apple signing assets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$IOS_CERTIFICATE_P12_BASE64" || -z "$IOS_PROVISION_PROFILE_BASE64" ]]; then
            echo "Apple signing assets not configured; skipping import."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Distribute IPA
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          TESTERS: ${{ vars.FIREBASE_APP_DISTRIBUTION_TESTERS }}
          EXPORT_OPTIONS_PLIST: ${{ vars.IOS_EXPORT_OPTIONS_PLIST }}
        run: ./scripts/distribute_ios.sh
